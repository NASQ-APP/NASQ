# إعداد Supabase المحلي — دولابي الذكي
project_id = "dulabi"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "12MiB"

[auth]
enabled = true
site_url = "http://localhost:5188"
additional_redirect_urls = ["http://localhost:5188"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
# رابط سحري + كلمة مرور (X-04)
enable_confirmations = false

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[realtime]
enabled = true

[edge_runtime]
enabled = true
policy = "oneshot"
